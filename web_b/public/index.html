<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Blade Web</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#c9d1d9;height:100vh;display:flex;flex-direction:column;max-width:900px;margin:0 auto;padding:20px;width:100%}
header{display:flex;align-items:center;gap:12px;padding-bottom:16px;border-bottom:1px solid #21262d;margin-bottom:16px}
header h1{font-size:24px;color:#58a6ff}header .status{margin-left:auto;font-size:13px;color:#3fb950;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#3fb950;display:inline-block}
.chat{flex:1;overflow-y:auto;padding:8px 0;min-height:300px;border-bottom:1px solid #21262d;margin-bottom:12px}
.msg{padding:10px 14px;margin-bottom:8px;border-radius:8px;word-wrap:break-word;white-space:pre-wrap;line-height:1.6;font-size:14px}
.msg.user{background:#1f2937;margin-left:auto;max-width:85%;border-bottom-right-radius:4px}
.msg.assistant{background:#161b22;border:1px solid #30363d;max-width:95%;border-bottom-left-radius:4px}
.msg .label{font-size:11px;font-weight:600;margin-bottom:4px;color:#8b949e}
.msg.user .label{color:#58a6ff}.msg.assistant .label{color:#f0883e}
.input{display:flex;gap:8px;padding:8px 0}
.input textarea{flex:1;padding:10px 12px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#c9d1d9;font-size:14px;resize:none;min-height:44px;max-height:120px;font-family:inherit;outline:none;transition:border-color .2s}
.input textarea:focus{border-color:#58a6ff}
.input button{padding:10px 24px;background:#238636;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;transition:background .2s;height:44px}
.input button:hover{background:#2ea043}
.input button:disabled{opacity:.5;cursor:not-allowed}
.status{color:#8b949e;font-size:12px;padding:8px 0;display:flex;justify-content:space-between}
.empty{color:#8b949e;text-align:center;padding:60px 20px}
.empty .icon{font-size:40px;margin-bottom:12px}
</style>
</head>
<body>
<header><h1>⚔️ Blade</h1><span class="status"><span class="dot"></span>在线</span></header>
<div class="chat" id="chat"><div class="empty"><div class="icon">⚔️</div><p>Blade 已就绪</p></div></div>
<div class="input"><textarea id="input" rows="1" placeholder="输入消息... (Enter 发送)"></textarea><button id="send">发送</button></div>
<div class="status"><span>DeepSeek v4 Flash</span><span id="info">就绪</span></div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input'),send=document.getElementById('send'),info=document.getElementById('info');
let streaming=false,curDiv=null,buf='',disp=0,timer=null;

function addMsg(r,c){
    const e=chat.querySelector('.empty');if(e)e.remove();
    const d=document.createElement('div');d.className='msg '+r;
    d.innerHTML='<div class="label">'+(r=='user'?'你':'Blade')+'</div><div class="content">'+(c||'')+'</div>';
    chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;
}

function pump(){
    if(!timer)return;
    const el=curDiv?.querySelector('.content');if(!el){clearInterval(timer);timer=null;return}
    let n=0;
    while(n<3&&disp<buf.length){el.textContent+=buf[disp];disp++;n++}
    chat.scrollTop=chat.scrollHeight;
    if(disp>=buf.length){clearInterval(timer);timer=null}
}

function feed(text){
    buf+=text;
    if(!timer)timer=setInterval(pump,10);
}

function flush(){
    if(timer){clearInterval(timer);timer=null}
    const el=curDiv?.querySelector('.content');
    if(el&&disp<buf.length){el.textContent=buf.slice(disp);disp=buf.length;chat.scrollTop=chat.scrollHeight}
}

async function sendMsg(){
    const msg=input.value.trim();if(!msg||streaming)return;
    streaming=true;send.disabled=true;send.textContent='⋯';info.textContent='思考中...';
    input.value='';curDiv=null;buf='';disp=0;if(timer){clearInterval(timer);timer=null}
    addMsg('user',msg);
    curDiv=addMsg('assistant','');
    try{
        const r=await fetch('/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});
        if(!r.ok)throw new Error('HTTP '+r.status);
        const rd=r.body.getReader(),dc=new TextDecoder();let b='';
        while(true){
            const{done,value}=await rd.read();if(done)break;
            b+=dc.decode(value,{stream:true});
            const evs=b.split('\n\n');b=evs.pop()||'';
            for(const ev of evs){
                for(const ln of ev.split('\n')){
                    if(!ln.startsWith('data: '))continue;
                    const d=ln.slice(6);
                    if(d==='[DONE]'){flush();streaming=false;send.disabled=false;send.textContent='发送';info.textContent='就绪';curDiv=null;break}
                    try{const p=JSON.parse(d);if(p.type==='chunk'&&p.content)feed(p.content);else if(p.type==='error')feed('\n[Error] '+p.content)}
                    catch(e){if(d&&d!=='')feed(d)}
                }
            }
        }
    }catch(err){feed('❌ '+err.message)}
    flush();streaming=false;send.disabled=false;send.textContent='发送';info.textContent='就绪';curDiv=null;
}
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}});
send.addEventListener('click',sendMsg);
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px'});
input.focus();
</script>
</body>
</html>
