<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blade Web</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background: #0d1117; color: #e6edf3; height: 100vh; display: flex; }
.sidebar { width: 260px; background: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; }
.sidebar h2 { padding: 16px; font-size: 16px; border-bottom: 1px solid #30363d; }
.sidebar .new-chat { margin: 12px; padding: 8px; background: #238636; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
.main { flex: 1; display: flex; flex-direction: column; }
.messages { flex: 1; overflow-y: auto; padding: 24px; }
.msg { margin-bottom: 20px; display: flex; }
.msg .avatar { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; margin-right: 12px; font-size: 14px; flex-shrink: 0; }
.msg.user .avatar { background: #238636; }
.msg.assistant .avatar { background: #1f6feb; }
.msg .content { max-width: 80%; line-height: 1.6; white-space: pre-wrap; font-size: 14px; }
.msg .content code { background: #161b22; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
.msg .content pre { background: #161b22; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
.input-area { border-top: 1px solid #30363d; padding: 16px; }
.input-row { display: flex; gap: 8px; }
.input-row textarea { flex: 1; padding: 10px 14px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #e6edf3; font-size: 14px; resize: none; outline: none; min-height: 44px; }
.input-row textarea:focus { border-color: #1f6feb; }
.input-row button { padding: 8px 20px; background: #238636; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
.input-row button:disabled { opacity: 0.5; cursor: not-allowed; }
.typing::after { content: '...'; animation: blink 1s steps(4) infinite; }
@keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div class="sidebar">
  <h2>⚔️ Blade</h2>
  <button class="new-chat" onclick="resetChat()">+ New Chat</button>
  <div style="flex:1"></div>
  <div style="padding:12px;font-size:12px;color:#8b949e;border-top:1px solid #30363d">
    v1.0.0 · <span id="status">disconnected</span>
  </div>
</div>
<div class="main">
  <div class="messages" id="messages">
    <div class="msg assistant">
      <div class="avatar">B</div>
      <div class="content">Hello! I'm Blade, ready to help. What are you working on?</div>
    </div>
  </div>
  <div class="input-area">
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="Type a message..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
      <button id="sendBtn" onclick="send()">Send</button>
    </div>
  </div>
</div>

<script>
const messages = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const statusEl = document.getElementById('status');

async function checkHealth() {
  try {
    const r = await fetch('/api/health');
    const d = await r.json();
    statusEl.textContent = d.provider + ' ' + d.model;
    statusEl.style.color = '#3fb950';
  } catch { statusEl.textContent = 'offline'; statusEl.style.color = '#f85149'; }
}
checkHealth();
setInterval(checkHealth, 30000);

async function send() {
  const prompt = input.value.trim();
  if (!prompt) return;
  input.value = '';
  input.style.height = 'auto';
  addMsg(prompt, 'user');
  sendBtn.disabled = true;

  const msgDiv = addMsg('', 'assistant');
  const contentDiv = msgDiv.querySelector('.content');
  contentDiv.classList.add('typing');

  try {
    const r = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt })
    });
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let text = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value);
      for (const line of chunk.split('\n')) {
        if (!line.startsWith('data: ')) continue;
        try {
          const data = JSON.parse(line.slice(6));
          if (data.type === 'token') { text += data.text; contentDiv.textContent = text; }
          else if (data.type === 'done') { contentDiv.classList.remove('typing'); }
          else if (data.type === 'error') { text += '\n[Error: ' + data.error + ']'; contentDiv.textContent = text; }
        } catch {}
      }
    }
    contentDiv.classList.remove('typing');
  } catch (e) {
    contentDiv.textContent = 'Error: ' + e.message;
    contentDiv.classList.remove('typing');
  }
  sendBtn.disabled = false;
}

function addMsg(text, role) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = '<div class="avatar">' + (role === 'user' ? 'U' : 'B') + '</div><div class="content">' + text + '</div>';
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

function resetChat() {
  messages.innerHTML = '<div class="msg assistant"><div class="avatar">B</div><div class="content">New session started. How can I help?</div></div>';
}
</script>
</body>
</html>
